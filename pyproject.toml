[project]
name = "ableton-mcp"
version = "1.4.5+automation.1"
description = "Local fork of ableton-mcp (MIT, Siddharth Ahuja) with clip/arrangement automation tools"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "supabase>=2.0.0",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["MCP_Server"]
